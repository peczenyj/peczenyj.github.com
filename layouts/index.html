{{ define "main" }}
<ul class="post-list">
  {{ range (where .Site.RegularPages "Section" "post").ByDate.Reverse }}
  <li>
    {{ if not .Date.IsZero }}<time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>{{ end }}
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
